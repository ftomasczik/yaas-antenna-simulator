[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yet-another-antenna-simulator"
version = "0.4.0.dev0"
description = "YAAS - Yet Another Antenna Simulator"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Federico Tomasczik" }
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "PyNEC>=2.3.4,<3.0",
    "numpy>=2.1,<3",
]

[project.scripts]
yaas = "yaas.cli.main:main"
yaas-gui = "yaas.gui.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.22,<7",
    "Babel>=2,<3",
]
# Interfaz gráfica experimental (ADR 0010). Solo PySide6-Essentials:
# verificado suficiente para QtWidgets; la instalación base no lo trae.
gui = [
    "PySide6-Essentials>=6.11.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
yaas = [
    "locales/*/LC_MESSAGES/*.mo",
]
