[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna-simulator"
version = "0.0.1"
description = "Simulador de antenas basado en NEC2++"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Federico Tomasczik" }
]
dependencies = [
    "PyNEC>=2.3.4,<3.0",
    "numpy>=2.1,<3",
]

[project.scripts]
antsim = "antsim.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.22,<7",
    "Babel>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
antsim = [
    "locales/*/LC_MESSAGES/*.mo",
]
