name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (editable, with dev dependencies)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

  test-ubuntu:
    name: Tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (editable, with dev dependencies)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

  test-ubuntu-24:
    name: Tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show OS release
        run: cat /etc/os-release

      - name: Show kernel/platform information
        run: uname -a

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (editable, with dev dependencies)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

  build-linux:
    name: Build executable (ubuntu-24.04)
    runs-on: ubuntu-24.04
    needs: test-ubuntu-24
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show OS release
        run: cat /etc/os-release

      - name: Show kernel/platform information
        run: uname -a

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (editable, with dev dependencies)
        run: python -m pip install -e ".[dev]"

      - name: Build experimental Linux executable
        run: bash scripts/build_linux.sh

  # GUI experimental (ADR 0010): jobs separados, con el extra opcional
  # "gui". Los jobs anteriores siguen instalando solo ".[dev]", sin Qt.
  test-gui-windows:
    name: GUI (windows-latest)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (editable, with dev and gui dependencies)
        run: python -m pip install -e ".[dev,gui]"

      - name: Run GUI tests
        run: python -m pytest tests/gui tests/test_gui_entry_point.py -v

      - name: Build experimental GUI executable
        run: .\scripts\build_gui_windows.ps1

  test-gui-ubuntu-24:
    name: GUI (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show OS release
        run: cat /etc/os-release

      - name: Show kernel/platform information
        run: uname -a

      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (editable, with dev and gui dependencies)
        run: python -m pip install -e ".[dev,gui]"

      - name: Run GUI tests
        run: python -m pytest tests/gui tests/test_gui_entry_point.py -v

      - name: Build experimental GUI executable
        run: bash scripts/build_gui_linux.sh
